name: CI

on:
  pull_request:
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, check e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osiris-app
    env:
      # o build usa $env/static/public; valores fictícios bastam, nada aqui acessa o banco
      PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: chave-ficticia-para-o-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: osiris-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
